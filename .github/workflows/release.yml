name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      target_sha:
        type: string
        required: true
      release_id:
        type: string
        required: true
    secrets:
      MY_ACTIONS_APP_CLIENT_ID:
        required: false
      MY_ACTIONS_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name != 'push' && format('cpp-actions-release-build-{0}', github.run_id) || 'cpp-actions-release' }}
  queue: max

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false
      - name: Validate release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_SHA: ${{ inputs.target_sha || github.sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must have the form vMAJOR.MINOR.PATCH without leading zeros"
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "::error::The checked-out commit does not match the release target"
            exit 1
          fi
          if [[ "$EVENT_NAME" != push && ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::A draft release ID is required for a called workflow"
            exit 1
          fi
      - name: Install Ninja
        run: command -v ninja || brew install ninja
      - name: Configure
        run: >-
          cmake --preset release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DFETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER
          -DBUILD_SHARED_LIBS=OFF
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release --output-on-failure
      - name: Package and verify
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          archive="cpp-actions-${TAG}-macos-arm64.tar.gz"
          stage="$RUNNER_TEMP/package"
          output="$RUNNER_TEMP/release"
          extracted="$RUNNER_TEMP/extracted"
          mkdir -p "$stage/share/licenses/cpp-actions" "$output" "$extracted"
          cmake --install build/release --prefix "$stage"
          cp LICENSE "$stage/LICENSE"
          cp build/release/_deps/yaml-cpp-src/LICENSE "$stage/share/licenses/cpp-actions/yaml-cpp"
          cp build/release/_deps/cli11-src/LICENSE "$stage/share/licenses/cpp-actions/CLI11"
          cp build/release/_deps/nlohmann_json-src/LICENSE.MIT "$stage/share/licenses/cpp-actions/nlohmann-json"
          tar -czf "$output/$archive" -C "$stage" .
          (
            cd "$output"
            shasum -a 256 "$archive" > "$archive.sha256"
            shasum -a 256 -c "$archive.sha256"
          )
          tar -xzf "$output/$archive" -C "$extracted"
          test -x "$extracted/bin/cpp-actions"
          test -x "$extracted/share/cpp-actions/scripts/install-hosted-python.sh"
          test "$(lipo -archs "$extracted/bin/cpp-actions")" = arm64
          test "$(vtool -show-build "$extracted/bin/cpp-actions" | awk '/minos/ {print $2}')" = 15.0
          version="$("$extracted/bin/cpp-actions" --version)"
          if [[ "$version" != "${TAG#v}" ]]; then
            echo "::error::Tag $TAG does not match the binary version $version"
            exit 1
          fi
          otool -L "$extracted/bin/cpp-actions" | tail -n +2 | awk '{print $1}' |
            while IFS= read -r library; do
              case "$library" in
                /usr/lib/*|/System/Library/*) ;;
                *) echo "::error::Unexpected dynamic library: $library"; exit 1 ;;
              esac
            done

          repo="$RUNNER_TEMP/smoke-repo"
          mkdir -p "$repo/.github/workflows"
          git -C "$repo" init -q
          printf '%s\n' \
            'name: Release smoke test' \
            'on: workflow_dispatch' \
            'jobs:' \
            '  test:' \
            '    runs-on: macos-latest' \
            '    steps:' \
            "      - run: test \"\$CPP_ACTIONS_VERSION\" = \"\$EXPECTED_VERSION\"" \
            > "$repo/.github/workflows/smoke.yml"
          printf '{}\n' > "$RUNNER_TEMP/smoke-config.yml"
          "$extracted/bin/cpp-actions" run --directory "$repo" --event workflow_dispatch \
            --no-sandbox --host-label macos-latest --no-color \
            --config "$RUNNER_TEMP/smoke-config.yml" \
            --env "EXPECTED_VERSION=${TAG#v}" \
            --run-dir "$RUNNER_TEMP/smoke-run" --cache-dir "$RUNNER_TEMP/smoke-cache"
      - name: Test Homebrew package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_INSTALL_FROM_API: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/release/cpp-actions-${TAG}-macos-arm64.tar.gz"
          tap="$(brew --repository)/Library/Taps/cpp-actions/homebrew-release-test"
          mkdir -p "$tap"
          git -C "$tap" init -q
          python3 - "$archive" "$tap/cpp-actions.rb" "$TAG" <<'PY'
          import hashlib
          from pathlib import Path
          import runpy
          import sys

          archive = Path(sys.argv[1]).resolve()
          output = Path(sys.argv[2])
          tag = sys.argv[3]
          template = Path(".github/homebrew/cpp-actions.rb.tmpl").read_text(encoding="utf-8")
          render = runpy.run_path("scripts/sync-homebrew.py")["render_formula"]
          output.write_text(
              render(template, tag[1:], hashlib.sha256(archive.read_bytes()).hexdigest(), archive.as_uri()),
              encoding="utf-8",
          )
          PY
          brew install --formula cpp-actions/release-test/cpp-actions
          brew test cpp-actions/release-test/cpp-actions
          prefix="$(brew --prefix cpp-actions)"
          test "$("$prefix/bin/cpp-actions" --version)" = "${TAG#v}"
          test -x "$(brew --prefix)/bin/cpp-actions"
          test -x "$prefix/share/cpp-actions/scripts/install-hosted-python.sh"
      - name: Upload release files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false
      - name: Download release files
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-files
          path: release
      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_SHA: ${{ inputs.target_sha || github.sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          ARTIFACT_DIR: release
        shell: bash
        run: bash scripts/publish-release.sh

  homebrew:
    needs: publish
    uses: ./.github/workflows/homebrew.yml
    permissions:
      contents: read
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      MY_ACTIONS_APP_CLIENT_ID: ${{ secrets.MY_ACTIONS_APP_CLIENT_ID }}
      MY_ACTIONS_APP_PRIVATE_KEY: ${{ secrets.MY_ACTIONS_APP_PRIVATE_KEY }}
